databases:
  - name: finops-db
    plan: free

services:
  - type: web
    name: finops-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finops-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # 첫 배포 후 finops-frontend에 실제로 할당된 URL로 값을 교체하세요.
      # (서비스 이름이 겹치면 Render가 임의 접미사를 붙일 수 있습니다.)
      - key: CORS_ORIGINS
        value: https://finops-frontend.onrender.com

  - type: web
    name: finops-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # 첫 배포 후 finops-backend에 실제로 할당된 URL로 값을 교체하고 재배포하세요.
      - key: VITE_API_BASE_URL
        value: https://finops-backend.onrender.com
