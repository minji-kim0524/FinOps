name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v --cov --cov-report=term-missing --cov-report=html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7
      # constraints.txt에 고정된 정확한 버전을 점검한다(이 CI는 운영과 같은 Python 3.11 기준).
      # 취약점이 발견돼도 빌드는 막지 않는다. 고정 버전은 자동으로 올라가지 않고, 수정판이 아직 안 나온
      # CVE도 있을 수 있어 막으면 무관한 PR까지 막히기 때문. 로그를 확인해 필요하면
      # backend/scripts/update_constraints.sh로 고정 버전을 갱신한다.
      - run: pip install -q pip-audit && pip-audit -r constraints.txt --no-deps || true

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 7
      - run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Set up backend venv (playwright.config.js expects backend/venv)
        working-directory: backend
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
